<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Piltide vahetus JS abil</title>
    <link rel="stylesheet" href="piltideVahetusStyle.css">
    <script src="piltideVahetusScript.js"></script>
</head>
<body onload="juhuslikPilt()">
<a href="../../../tood.html" class="back-link">&larr; Tagasi tehtud tööde juurde</a>

<h1>Juhuslik pilt</h1>
<img src="Pildid/smile.png" alt="" id="randomPilt">
<br>
<input type="button" onclick="juhuslikPilt()" value="Vaheta pilt">

<section id="myistatus">
    <h2>Mõistatus. Arva ära mida näed pildil?</h2>
    <select name="valik" id="valik" onchange="selectValik()">
        <option value="vali...">vali</option>
        <option value="Pildid/smile.png">Smile</option>
        <option value="Pildid/lill.png">Lilleke</option>
        <option value="Pildid/neutral.png">Neutral</option>
        <option value="Pildid/kurb.png">Kurb</option>
    </select>
    <div id="vastus">Siia tuleb vastus</div>
</section>

<section id="valik2">
    <h2>Vali pilt radio abil:</h2>
    <input type="radio" name="piltValik" id="v1" value="Pildid/kurb.png" onclick="radioValik()">
    <label for="v1">Kurb pilt</label>
    <br>
    <input type="radio" name="piltValik" id="v2" value="Pildid/smile.png" onclick="radioValik()">
    <label for="v2">Smile pilt</label>
    <br>
    <input type="radio" name="piltValik" id="v3" value="Pildid/neutral.png" onclick="radioValik()">
    <label for="v3">Neutral pilt</label>
    <br>
    <input type="radio" name="piltValik" id="v4" value="Pildid/lill.png" onclick="radioValik()">
    <label for="v4">Lill pilt</label>
    <br>
    <img src="" alt="" id="valitudPilt">
</section>

</body>
</html>
