<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Piltide vahetus JS abil</title>
    <link rel="stylesheet" href="piltStyle.css">
    <script src="../js/piltScript.js"></script>
</head>
<body onload="juhuslikPilt()">

<h1>Juhuslik pilt</h1>
<img src="../pilt/Smile.png" alt="" id="randomPilt">
<br>
<input type="button" onclick="juhuslikPilt()" value="Vaheta pilt">

<section id="myistatus">
    <h2>Mõistatus. Arva ära mida näed pildil?</h2>
    <select name="valik" id="valik" onchange="selectValik()">
        <option value="vali...">vali</option>
        <option value="../pilt/Smile.png">Smile</option>
        <option value="../pilt/Lill.png">Lilleke</option>
        <option value="../pilt/Neutral.png">Neutral</option>
        <option value="../pilt/Kurb.png">Kurb</option>
    </select>
    <div id="vastus">Siia tuleb vastus</div>
</section>

<section id="valik2">
    <h2>Vali pilt radio abil:</h2>
    <input type="radio" name="piltValik" id="v1" value="../pilt/Kurb.png" onclick="radioValik()">
    <label for="v1">Kurb pilt</label>
    <br>
    <input type="radio" name="piltValik" id="v2" value="../pilt/Smile.png" onclick="radioValik()">
    <label for="v2">Smile pilt</label>
    <br>
    <input type="radio" name="piltValik" id="v3" value="../pilt/Neutral.png" onclick="radioValik()">
    <label for="v3">Neutral pilt</label>
    <br>
    <input type="radio" name="piltValik" id="v4" value="../pilt/Lill.png" onclick="radioValik()">
    <label for="v4">Lill pilt</label>
    <br>
    <img src="" alt="" id="valitudPilt">
</section>

</body>
</html>
