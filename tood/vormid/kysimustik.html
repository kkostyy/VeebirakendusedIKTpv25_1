<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Muusika küsimustik</title>
    <link rel="stylesheet" href="VormStyle.css">
    <script src="../js/kysimustikScript.js" defer></script>
</head>
<body>
<h1>Muusika küsimustik</h1>
<div>HTML vormid ja nupud</div>

<form action="#">
    <table style="border: 1px solid black;">
        <tr>
            <td>
                <label for="nimi">Nimi:</label>
            </td>
            <td>
                <input type="text" id="nimi" placeholder="Konstantin" oninput="nimiLugemineKastist()">
            </td>
            <td>
                <div id="vastus1"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="stiil">Vali meeldivaim muusikastiil:</label>
            </td>
            <td>
                <select name="stiil" id="stiil" onchange="sellectValik()">
                    <option value="vali">Vali...</option>
                    <option value="Hiphop">Hiphop</option>
                    <option value="kantri">Kantri</option>
                    <option value="rock">Rock</option>
                    <option value="funk">Funk</option>
                    <option value="metal">Metal</option>
                    <option value="pop">Pop</option>
                </select>
            </td>
            <td>
                <div id="vastus5"></div>
            </td>
        </tr>
        <tr>
            <td>
                <strong>Platvorm:</strong>
            </td>
            <td>
                <input type="radio" name="platvorm" id="spotify" value="Spotify" onclick="radioValik()">
                <label for="spotify">Spotify</label><br>
                <input type="radio" name="platvorm" id="raadio" value="Raadio" onclick="radioValik()">
                <label for="raadio">Raadio</label><br>
                <input type="radio" name="platvorm" id="vinüülplaat" value="Vinüülplaat" onclick="radioValik()">
                <label for="vinüülplaat">Vinüülplaat</label>
            </td>
            <td>
                <div id="vastus2">
                    <img id="pilt" src="" alt="" class="pildi-ikoon" style="display: none;">
                </div>
            </td>
        </tr>
        <tr>
            <td>
                <strong>Milliseid muusikuid/ansambleid sa tead?</strong>
            </td>
            <td>
                <input type="checkbox" name="lemmikud" id="Radiohead" value="Radiohead" onclick="checkboxValik()">
                <label for="Radiohead">Radiohead</label><br>
                <input type="checkbox" name="lemmikud" id="rollingstones" value="Rolling Stones" onclick="checkboxValik()">
                <label for="rollingstones">Rolling Stones</label><br>
                <input type="checkbox" name="lemmikud" id="thesmiths" value="The Smiths" onclick="checkboxValik()">
                <label for="thesmiths">The Smiths</label><br>
                <input type="checkbox" name="lemmikud" id="thesmashingpumpkins" value="The Smashing Pumpkins" onclick="checkboxValik()">
                <label for="thesmashingpumpkins">The Smashing Pumpkins</label>
            </td>
            <td>
                <div id="vastus3"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="tund">Mitu tundi päevas sa kuulad muusikat?</label>
            </td>
            <td>
                0 <input type="range" id="tund" min="0" max="24" value="2" oninput="rangeValik()"> 24
            </td>
            <td>
                <div id="vastus4"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="email">Kirjuta oma e-mail:</label>
            </td>
            <td>
                <input type="email" id="email" placeholder="kosgaponenko@gmail.com" oninput="emailValik()">
            </td>
            <td>
                <div id="vastusEmail"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="arvamus">Mida arvad muusika kuulamisest koolis?</label>
            </td>
            <td>
                <textarea id="arvamus" rows="3" cols="25" oninput="arvamusValik()"></textarea>
            </td>
            <td>
                <div id="vastusArvamus"></div>
            </td>
        </tr>
        <tr>
            <td>
                <strong>Kas sa kuulad raadiot?</strong>
            </td>
            <td>
                <input type="radio" name="raadioValik" id="jah" value="Jah" onclick="radioValik2()">
                <label for="jah">Jah</label><br>
                <input type="radio" name="raadioValik" id="ei" value="Ei" onclick="radioValik2()">
                <label for="ei">Ei</label><br>
            </td>
            <td>
                <div id="vastus6"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="jaamad">Milliseid raadiojaamu oskad nimetada?</label>
            </td>
            <td>
                <input type="text" id="jaamad" oninput="jaamadValik()">
            </td>
            <td>
                <div id="vastus7"></div>
            </td>
        </tr>
        <tr>
            <td>
                <input type="reset" value="Puhasta" onclick="puhasta()">
            </td>
            <td colspan="2">
                <input type="button" value="Saada / Näita andmed" onclick="naitaKoike()">
            </td>
        </tr>
        <tr>
            <td colspan="3">
                <div id="vastusKoik"></div>
            </td>
        </tr>
    </table>
</form>
</body>
</html>
