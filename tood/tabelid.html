<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Tabelid</title>
    <link rel="stylesheet" href="tabelStyle.css">
</head>
<body>
<h1>Tabelid</h1>
<h2>Lihtne tabel</h2>
<table id="lihtne1">
    <tr>
        <td class="nimia">A</td>
        <td>B</td>
    </tr>
    <tr>
        <td>C</td>
        <td>D</td>
    </tr>
</table>
<h2>Tabel kus ühendatud lahtri</h2>
<table id="keeruline1">
    <tr>
        <td colspan="2" class="nimia">A</td>
    </tr>
    <tr>
        <td>C</td>
        <td>D</td>
    </tr>
</table>
<h2>Veel üks tabel kus on ühendatud lahtri</h2>
<table id="keeruline2">
    <tr>
        <td rowspan="2" class="nimia">A</td>
        <td>B</td>
    </tr>
    <tr>
        <td>D</td>
    </tr>
</table>
<h2>Veel üks tabel kus on ühendatud lahtri</h2>
<table id="keeruline3">
    <tr>
        <td rowspan="4" class="nimia">A</td>
        <td>B</td>
        <td>C</td>
        <td>D</td>
    </tr>
    <tr>
        <td>E</td>
        <td colspan="2" class="nimia">F</td>
    </tr>
</table>



</body>
</html>
